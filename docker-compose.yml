services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: c2cdirect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d c2cdirect"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/c2cdirect
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  n8n:
    image: n8nio/n8n:1.108.2
    ports: ["5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-change-me}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes: ["n8n-data:/home/node/.n8n"]
volumes:
  postgres-data:
  n8n-data:
