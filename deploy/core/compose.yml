name: c2cdirect-core

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: c2cdirect
      POSTGRES_USER: c2cdirect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-core.sh}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run scripts/setup-core.sh}
    volumes:
      - core-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c2cdirect -d c2cdirect"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build: ../../backend
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql://c2cdirect:${POSTGRES_PASSWORD}@postgres:5432/c2cdirect
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run scripts/setup-core.sh}
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../../backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://c2cdirect_app:${APP_DATABASE_PASSWORD}@postgres:5432/c2cdirect
      FRONTEND_ORIGIN: http://127.0.0.1:${CORE_PORT:-8080}
      AUTH_DISABLED_FOR_LOCAL_DEV: ${AUTH_DISABLED_FOR_LOCAL_DEV:-true}
      SOURCE_URL: ${SOURCE_URL:-https://directc2c.com/#core}
      C2CDIRECT_MODEL_PROVIDER: ${C2CDIRECT_MODEL_PROVIDER:-deterministic}
      C2CDIRECT_MODEL_BASE_URL: ${C2CDIRECT_MODEL_BASE_URL:-}
      C2CDIRECT_MODEL_NAME: ${C2CDIRECT_MODEL_NAME:-local-rules}
      C2CDIRECT_MODEL_API_KEY: ${C2CDIRECT_MODEL_API_KEY:-}
      C2CDIRECT_MODEL_INPUT_COST_PER_MILLION: ${C2CDIRECT_MODEL_INPUT_COST_PER_MILLION:-0}
      C2CDIRECT_MODEL_OUTPUT_COST_PER_MILLION: ${C2CDIRECT_MODEL_OUTPUT_COST_PER_MILLION:-0}
      C2CDIRECT_MODEL_TIMEOUT_SECONDS: ${C2CDIRECT_MODEL_TIMEOUT_SECONDS:-30}
      C2CDIRECT_CONFIG_ENCRYPTION_KEY: ${C2CDIRECT_CONFIG_ENCRYPTION_KEY:?Run scripts/setup-core.sh}
      EMAIL_TOKEN_ENCRYPTION_KEY: ${EMAIL_TOKEN_ENCRYPTION_KEY:?Run scripts/setup-core.sh}
      DAILY_AI_BUDGET_USD: ${DAILY_AI_BUDGET_USD:-10}
      MAX_RUN_COST_USD: ${MAX_RUN_COST_USD:-0.10}
      MAX_RUN_TOKENS: ${MAX_RUN_TOKENS:-12000}
      EMAIL_OAUTH_REDIRECT_BASE: ${EMAIL_OAUTH_REDIRECT_BASE:-http://127.0.0.1:${CORE_PORT:-8080}/api/v1/email/oauth}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: ../../backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://c2cdirect_app:${APP_DATABASE_PASSWORD}@postgres:5432/c2cdirect
      C2CDIRECT_CONFIG_ENCRYPTION_KEY: ${C2CDIRECT_CONFIG_ENCRYPTION_KEY}
      EMAIL_TOKEN_ENCRYPTION_KEY: ${EMAIL_TOKEN_ENCRYPTION_KEY}
      C2CDIRECT_MODEL_PROVIDER: ${C2CDIRECT_MODEL_PROVIDER:-deterministic}
      C2CDIRECT_MODEL_BASE_URL: ${C2CDIRECT_MODEL_BASE_URL:-}
      C2CDIRECT_MODEL_NAME: ${C2CDIRECT_MODEL_NAME:-local-rules}
      C2CDIRECT_MODEL_API_KEY: ${C2CDIRECT_MODEL_API_KEY:-}
      C2CDIRECT_MODEL_INPUT_COST_PER_MILLION: ${C2CDIRECT_MODEL_INPUT_COST_PER_MILLION:-0}
      C2CDIRECT_MODEL_OUTPUT_COST_PER_MILLION: ${C2CDIRECT_MODEL_OUTPUT_COST_PER_MILLION:-0}
      DAILY_AI_BUDGET_USD: ${DAILY_AI_BUDGET_USD:-10}
      MAX_RUN_COST_USD: ${MAX_RUN_COST_USD:-0.10}
      MAX_RUN_TOKENS: ${MAX_RUN_TOKENS:-12000}
      GMAIL_OAUTH_CLIENT_ID: ${GMAIL_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.acquisition_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    profiles: ["web-search"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-disabled-web-search}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
      - core-searxng:/var/cache/searxng

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_started

volumes:
  core-postgres:
  core-searxng:
